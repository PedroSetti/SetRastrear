server {
 listen 443 ssl;
 ssl_certificate /etc/nginx/certs/server.pem;
 ssl_certificate_key /etc/nginx/certs/server-key.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
 location /docs { proxy_pass http://backend:8000; }
 location /openapi.json { proxy_pass http://backend:8000; }
 location / { try_files $uri /index.html; }
}
