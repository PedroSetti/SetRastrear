name: Verificar projeto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validar migrations PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test-only-ci@localhost:5432/test
          JWT_SECRET: chave-exclusiva-de-teste-ci-nao-usar-em-producao
          APP_ENV: production
        run: python -m alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      - run: node scripts/test-netlify.mjs
