name: Compilar Android
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Origem HTTPS definitiva do backend ou do painel com proxy /api
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      RMB_SERVER_URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Compilar APKs e AAB (release sem assinatura)
        working-directory: android
        run: bash gradlew assembleDebug assembleQa assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RastrearMB-Android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
