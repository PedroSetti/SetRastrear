# Recursos pagos: confira planos e valores na sua conta antes de confirmar.
services:
  - type: web
    name: setrastrear-api
    runtime: python
    region: virginia
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: setrastrear-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
databases:
  - name: setrastrear-db
    region: virginia
    databaseName: setrastrear
    user: setrastrear
    plan: basic-256mb
