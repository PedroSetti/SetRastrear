# Testes gratuitos. PostgreSQL expira em 30 dias.
# Recursos existentes foram criados por MCP; importe-os antes de aplicar um Blueprint.
services:
  - type: web
    name: setrastrear
    runtime: docker
    region: virginia
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: setrastrear-db
          property: connectionString
databases:
  - name: setrastrear-db
    region: virginia
    databaseName: setrastrear_db
    user: setrastrear_db_user
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []
